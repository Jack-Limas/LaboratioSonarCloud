name: Quality Gate - SonarCloud
on:
  push:
    branches: [ "main" ]
jobs:
  sonarcloud:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          PYTHONPATH=. pytest --cov=. --cov-report=xml

      - name: Analisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jack-limas
            -Dsonar.projectKey=jack-limas_LaboratioSonarCloud
            -Dsonar.python.coverage.reportPaths=coverage.xml
